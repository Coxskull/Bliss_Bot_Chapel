name: Task20 Ask Alpha isolated offline guardrail regression
on:
  pull_request:
    paths:
      - 'scripts/agm-ask-alpha-offline-guards.mjs'
      - 'supabase/functions/alpha-public-intake/ask-alpha.mjs'
      - '.github/workflows/task20-ask-alpha-guardrails.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task20-offline-no-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed consent, rate, idempotency, metering and provider receipt tests (mock only)
        run: node scripts/agm-ask-alpha-offline-guards.mjs
