name: Task20 OpenAI project-model private access preflight, mocked
on:
  pull_request:
    paths:
      - 'scripts/task20-openai-project-model-preflight.mjs'
      - 'scripts/task20-openai-project-model-preflight.test.mjs'
      - '.github/workflows/task20-openai-project-model-preflight.yml'
      - 'docs/task20-nonbillable-project-model-preflight-20261110.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task20-mock-only-nonbillable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test synthetic project and model access; never send real requests
        run: node --test scripts/task20-openai-project-model-preflight.test.mjs
