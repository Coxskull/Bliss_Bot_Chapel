name: .NET 8 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show SDK version
        run: dotnet --info

      - name: Install media runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Restore solution
        run: dotnet restore BlissBotChapel.sln

      - name: Build Release
        run: dotnet build BlissBotChapel.sln --configuration Release --no-restore

      - name: Run regression tests
        run: dotnet test Bliss.Tests/Bliss.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=bliss-tests.trx" --results-directory TestResults

      - name: Audit vulnerable NuGet dependencies
        shell: bash
        run: |
          set -o pipefail
          dotnet list BlissBotChapel.sln package --vulnerable --include-transitive | tee nuget-vulnerability-audit.txt
          if grep -Eiq 'GHSA-[A-Z0-9-]+|CVE-[0-9]{4}-[0-9]+' nuget-vulnerability-audit.txt; then
            echo "::error::The NuGet audit output contains one or more vulnerability advisories."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bliss-test-results-${{ github.run_number }}
          path: |
            TestResults/**/*.trx
            nuget-vulnerability-audit.txt
          if-no-files-found: warn
          retention-days: 14

  container-build:
    name: Build production container image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag bliss-bot-chapel:ci .
