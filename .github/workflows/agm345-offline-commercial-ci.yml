name: AGM 345 Offline Inventory & Geometry Contract
on:
  pull_request:
    paths:
      - '.github/workflows/agm345-offline-commercial-ci.yml'
      - 'Bliss.Domain/AdvertisingRealEstate/**'
      - 'Bliss.Tests/AdvertisingRealEstate/CommercialInventoryReviewGateTests.cs'
      - 'Bliss.Tests/AdvertisingRealEstate/CommercialCreativeQaGateTests.cs'
      - 'Bliss.Domain/CreativeAcademy/CommercialCreativeQaGate.cs'
      - 'Bliss.Domain/Demonstrations/SyntheticCommercialDeliveryEvidence.cs'
      - 'Bliss.Tests/AdvertisingRealEstate/SyntheticCommercialDeliveryEvidenceTests.cs'
      - 'Bliss.Domain/Economics/CommercialEconomicsReadOnlyGate.cs'
      - 'Bliss.Tests/AdvertisingRealEstate/CommercialEconomicsReadOnlyGateTests.cs'
      - 'assets/alpha-prototypes/advertising-real-estate/AGM345-OFFLINE-ASSET-EVIDENCE.tsv'
      - 'docs/launch/ALPHA-345-OFFLINE-COMMERCIAL-SLICE.md'
      - 'tools/AGM345.OfflineProbe/**'
      - 'tools/AGM345.ProductFactory/**'
      - 'assets/alpha-prototypes/advertising-real-estate/AGM345-PREMIUM-2-4-6-CONCEPT-LAYOUTS.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agm345-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-commercial-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore existing Bliss solution without migrations or services
        run: dotnet restore BlissBotChapel.sln
      - name: Test owner geometry, protected content and existing Ask Alpha retrieval in isolation
        run: |
          dotnet test Bliss.Tests/Bliss.Tests.csproj --no-restore --filter 'FullyQualifiedName~CommercialInventoryReviewGateTests|FullyQualifiedName~CommercialCreativeQaGateTests|FullyQualifiedName~SyntheticCommercialDeliveryEvidenceTests|FullyQualifiedName~CommercialEconomicsReadOnlyGateTests' --logger "trx;LogFileName=agm345-contract.trx" --results-directory ./AGM345Results --verbosity normal
      - name: Emit reproducible fictional conversation and retrieval JSON
        run: |
          dotnet run --project tools/AGM345.OfflineProbe/AGM345.OfflineProbe.csproj -- --output AGM345Results/agm345-synthetic-conversations.json
          test -s AGM345Results/agm345-synthetic-conversations.json
          grep -Fq '"commitmentAuthorized": false' AGM345Results/agm345-synthetic-conversations.json
          grep -Fq '"ActualDisplayVerified": false' AGM345Results/agm345-synthetic-conversations.json
          grep -Fq '"CanStatePriceToCustomer": false' AGM345Results/agm345-synthetic-conversations.json
          grep -Fq '"RealProductBindingVerified": false' AGM345Results/agm345-synthetic-conversations.json
          grep -Fq '"economicsQuoteStatus": "PRICING_UNAVAILABLE"' AGM345Results/agm345-synthetic-conversations.json
      - name: Validate proposed premium 2, 4 and 6 layouts (owner authority remains blocked)
        run: |
          python3 tools/AGM345.ProductFactory/verify_premium_layouts.py --selftest --receipt AGM345Results/agm345-premium-layout-verification.json
          test -s AGM345Results/agm345-premium-layout-verification.json
          grep -Fq '"source": "DRAFT_CONCEPT_NOT_OWNER_APPROVED"' AGM345Results/agm345-premium-layout-verification.json
      - name: Install free distro FFmpeg and local font only when missing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then
            sudo apt-get -qq update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          command -v ffmpeg
          command -v ffprobe
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Produce a finished fictional advertisement using installed local FFmpeg
        run: |
          command -v ffmpeg
          command -v ffprobe
          python3 tools/AGM345.ProductFactory/produce.py --output-dir AGM345Results/final-product
          python3 tools/AGM345.ProductFactory/verify_product.py --product-dir AGM345Results/final-product
          test -s AGM345Results/final-product/orchid-roast-creator-overlay.mp4
          test -s AGM345Results/final-product/orchid-roast-ad-poster.png
          test -s AGM345Results/final-product/product-receipt.json
      - name: Fail closed if suite produced no test artifact
        run: |
          test -s AGM345Results/agm345-contract.trx
          test -s AGM345Results/agm345-synthetic-conversations.json
          test -s AGM345Results/final-product/product-receipt.json
          echo 'AGM345_OFFLINE_SOURCE_ONLY — NO CUSTOMER QUOTES, OUTREACH, RESERVATIONS, PRODUCTION DB OR DELIVERY'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agm345-offline-contract-${{ github.run_id }}
          path: |
            AGM345Results/*.trx
            AGM345Results/*.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agm345-finished-demo-product-${{ github.run_id }}
          path: |
            AGM345Results/final-product/*.mp4
            AGM345Results/final-product/*.png
            AGM345Results/final-product/*.json
          if-no-files-found: warn
          retention-days: 7
