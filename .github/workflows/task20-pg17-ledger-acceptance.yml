name: Task20 PostgreSQL17 AI finance and retention acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/task20-pg17-ledger-acceptance.yml'
      - 'scripts/agm-ask-alpha-sql-acceptance.sql'
      - 'scripts/agm-ask-alpha-retention-acceptance.sql'
      - 'scripts/agm-ask-alpha-project9-release-rehearsal.sql'
      - 'scripts/task20-readonly-hosted-budget-preflight.sql'
      - 'supabase/migrations/20261108_alpha_ask_alpha_ai_governor.sql'
      - 'supabase/migrations/20261108_alpha_ask_alpha_receipts_retention_90d.sql'
      - 'supabase/migrations/20261110000000_alpha_ask_alpha_project9_budget_cap.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai-finance-pg17-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client for the CI-only container
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Enforce disposable localhost PG17 target
        shell: bash
        run: |
          set -euo pipefail
          test "$PGPASSWORD" = postgres
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -f scripts/agm-ask-alpha-sql-acceptance.sql
          test -f scripts/agm-ask-alpha-retention-acceptance.sql
          psql --no-password -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -Atqc "SELECT current_setting('server_version_num')::int BETWEEN 170000 AND 179999" | grep -qx t
          psql --no-password -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE task20_disposable_test'
      - name: Verify budget, RLS, reservation, replay, failed-meter and retention invariants
        shell: bash
        run: |
          set -euo pipefail
          psql --no-password -h 127.0.0.1 -p 5432 -U postgres -d task20_disposable_test -v ON_ERROR_STOP=1 -f scripts/agm-ask-alpha-sql-acceptance.sql > task20-finance.log 2>&1
          grep -q TASK20_SQL_ATOMIC_BUDGET_RLS_IDEMPOTENCY_FAILCLOSED_PASS task20-finance.log
          grep -q TASK20_PROJECT9_FORWARD_ONLY_GOVERNOR_CAP_PASS task20-finance.log
          psql --no-password -h 127.0.0.1 -p 5432 -U postgres -d task20_disposable_test -v ON_ERROR_STOP=1 -Atqc "SELECT position('month_usd+cfg.externally_billed_usd+0.010000>9.000000' in pg_get_functiondef('public.alpha_ask_alpha_reserve(uuid,text,text,text,text,text,boolean)'::regprocedure)) > 0" | grep -qx t
          psql --no-password -h 127.0.0.1 -p 5432 -U postgres -d task20_disposable_test -v ON_ERROR_STOP=1 -f scripts/agm-ask-alpha-retention-acceptance.sql > task20-retention.log 2>&1
          grep -q TASK20_RETENTION_90D_KEEP_UNSETTLED_PASS task20-retention.log
          test "$(psql --no-password -h 127.0.0.1 -p 5432 -U postgres -d task20_disposable_test -v ON_ERROR_STOP=1 -Atqc 'SELECT enabled FROM public.alpha_ask_alpha_settings WHERE id=1')" = t
          # Only disposable CI fixture: it was enabled in the synthetic test; production remains untouched.
          echo TASK20_POSTGRES17_LEDGER_AND_RETENTION_PASS
      - name: Rehearse fail-closed release, refusal while enabled, and safe migration retry
        shell: bash
        run: |
          set -euo pipefail
          pg() { psql --no-password -h 127.0.0.1 -p 5432 -U postgres -d task20_disposable_test -v ON_ERROR_STOP=1 "$@"; }
          # Synthetic SQL fixture deliberately leaves the governor ON.
          test "$(pg -Atqc 'SELECT enabled FROM public.alpha_ask_alpha_settings WHERE id=1')" = t
          receipt_before="$(pg -Atqc 'SELECT count(*) FROM public.alpha_ask_alpha_turns')"
          meter_before="$(pg -Atqc 'SELECT externally_billed_usd FROM public.alpha_ask_alpha_settings WHERE id=1')"
          set +e
          pg -f supabase/migrations/20261110000000_alpha_ask_alpha_project9_budget_cap.sql > task20-refusal.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'TASK20_PROJECT9_REQUIRES_AI_DISABLED' task20-refusal.log
          test "$(pg -Atqc 'SELECT enabled FROM public.alpha_ask_alpha_settings WHERE id=1')" = t
          # Emergency fail-closed STOP only in the disposable fixture.
          pg -c 'UPDATE public.alpha_ask_alpha_settings SET enabled=false WHERE id=1'
          pg -f supabase/migrations/20261110000000_alpha_ask_alpha_project9_budget_cap.sql > task20-reapply.log 2>&1
          grep -q 'TASK20_PROJECT9_FORWARD_ONLY_GOVERNOR_CAP_PASS' task20-reapply.log
          pg -f scripts/agm-ask-alpha-project9-release-rehearsal.sql > task20-rehearsal.log 2>&1
          grep -q 'TASK20_PROJECT9_FAILCLOSED_REHEARSAL_PASS' task20-rehearsal.log
          test "$(pg -Atqc 'SELECT count(*) FROM public.alpha_ask_alpha_turns')" = "$receipt_before"
          test "$(pg -Atqc 'SELECT externally_billed_usd FROM public.alpha_ask_alpha_settings WHERE id=1')" = "$meter_before"
          echo TASK20_PROJECT9_FAILCLOSED_RELEASE_REHEARSAL_PASS
      - name: Verify portable read-only release preflight contract
        shell: bash
        run: |
          set -euo pipefail
          # This script is safe for read-only hosted catalog checks; CI runs it
          # exclusively on this container's disposable PostgreSQL 17 fixture.
          psql --no-password -h 127.0.0.1 -p 5432 -U postgres \
            -d task20_disposable_test -v ON_ERROR_STOP=1 -Atq \
            -f scripts/task20-readonly-hosted-budget-preflight.sql > task20-preflight.json
          node -e '
            const fs=require("node:fs");
            const r=JSON.parse(fs.readFileSync("task20-preflight.json","utf8"));
            if(!(r.ai_disabled===true && r.sql_cap_9===true &&
              r.legacy_cap_10===false && r.rpc_restricted===true &&
              r.private_rls===true && r.receipt_count===2 &&
              r.unresolved_count===1)) {
              console.error("TASK20_PREFLIGHT_INVARIANT_FAILED");
              process.exit(1);
            }
            console.log("TASK20_READONLY_PREFLIGHT_INVARIANTS_PASS");
          '
      - name: Upload sanitized synthetic SQL acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task20-pg17-synthetic-ledger
          path: |
            task20-finance.log
            task20-retention.log
            task20-refusal.log
            task20-reapply.log
            task20-rehearsal.log
            task20-preflight.json
          if-no-files-found: ignore
          retention-days: 7
