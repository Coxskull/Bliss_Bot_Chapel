name: Task20 gateway ingress negative triple probe
on:
  pull_request:
    paths:
      - '.github/workflows/task20-gateway-ingress-negative.yml'
      - 'scripts/task20-gateway-ingress-negative.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-ingress-negative-no-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require synthetic, nonbillable, expiry-limited test source
        run: |
          node --check scripts/task20-gateway-ingress-negative.mjs
          test -z "$(printenv OPENAI_API_KEY || true)"
          grep -q 'ai_processing_consent:false' scripts/task20-gateway-ingress-negative.mjs
          grep -q 'TASK20_INGRESS_PROBE_EXPIRED' scripts/task20-gateway-ingress-negative.mjs
      - name: Clean versus spoofed CF and XFF, denied before inference
        run: node scripts/task20-gateway-ingress-negative.mjs
