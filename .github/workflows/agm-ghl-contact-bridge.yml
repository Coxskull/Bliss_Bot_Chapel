name: ALPHA GHL CRM consent and outbox bridge
on:
  pull_request:
    paths:
      - 'supabase/functions/alpha-public-intake/**'
      - 'supabase/functions/alpha-ghl-retry/**'
      - 'supabase/functions/alpha-ghl-preflight/**'
      - 'supabase/functions/alpha-ghl-readback/**'
      - 'docs/alpha-highlevel-crm-bridge.md'
      - 'supabase/migrations/20261105_alpha_ghl_contact_delivery.sql'
      - 'supabase/migrations/20261108130100_alpha_budget_first_intake.sql'
      - 'supabase/migrations/20261108170000_alpha_ghl_review_audit.sql'
      - 'frontend/public/join-creator.html'
      - 'frontend/public/join-advertiser.html'
      - 'frontend/public/alpha-intake.js'
      - 'frontend/public/alpha-privacy.html'
      - 'frontend/public/alpha-terms.html'
      - 'scripts/agm-ghl-*.mjs'
      - 'scripts/task22/production-crm-optout-local-transport-hold-20261112.sql'
      - 'scripts/task22-crm-optout-source-contract.mjs'
      - 'frontend/public/global-media.html'
      - 'frontend/public/wedding-planner.js'
      - 'scripts/build-vercel-portal.mjs'
      - 'scripts/task20-hosted-browser-consent-smoke.mjs'
      - 'scripts/task20-ask-alpha-history-negative.mjs'
      - 'scripts/task20-hosted-ingress-attestation.test.mjs'
      - 'scripts/agm-marketplace-budget-smoke.mjs'
      - 'scripts/task21/staging-alert-ledger-contract.test.mjs'
      - 'scripts/task21/staging-alert-gmail-agent-receipt-ledger-20261112.sql'
      - '.github/workflows/agm-ghl-contact-bridge.yml'
permissions:
  contents: read
jobs:
  mapping-and-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/agm-ghl-unit-smoke.mjs
      - run: node scripts/agm-ghl-readback-smoke.mjs
      - name: Assert Task22 local CRM opt-out prevention gates
        run: node scripts/task22-crm-optout-source-contract.mjs
      - run: node scripts/agm-marketplace-budget-smoke.mjs
      - name: Assert Task21 private staging-only alert provider/ACK ledger (offline)
        run: node scripts/task21/staging-alert-ledger-contract.test.mjs
      - run: node scripts/task20-hosted-ingress-attestation.test.mjs
      - name: Assert Ask Alpha public AI consent and hosted endpoint (offline)
        run: |
          node --check frontend/public/wedding-planner.js
          node scripts/task20-hosted-browser-consent-smoke.mjs
      - name: Verify Ask Alpha history privacy and pre-metering denials (offline)
        run: node scripts/task20-ask-alpha-history-negative.mjs
      - name: Verify GoHighLevel is not in browser code
        run: |
          node - <<'NODE'
          const fs = require('node:fs'); const assert = require('node:assert/strict');
          const browser = fs.readFileSync('frontend/public/alpha-intake.js','utf8');
          const privacy = fs.readFileSync('frontend/public/alpha-privacy.html','utf8');
          const creator = fs.readFileSync('frontend/public/join-creator.html','utf8');
          const advertiser = fs.readFileSync('frontend/public/join-advertiser.html','utf8');
          const api = fs.readFileSync('supabase/functions/alpha-public-intake/index.ts','utf8');
          const retry = fs.readFileSync('supabase/functions/alpha-ghl-retry/index.ts','utf8');
          const preflight = fs.readFileSync('supabase/functions/alpha-ghl-preflight/index.ts','utf8');
          const readback = fs.readFileSync('supabase/functions/alpha-ghl-readback/index.ts','utf8');
          assert.ok(retry.includes('req.headers.get("Authorization") !== "Bearer "+adminKey'));
          assert.ok(preflight.includes('req.headers.get("Authorization") !== "Bearer " + adminKey'));
          assert.ok(readback.includes('req.headers.get("Authorization") !== "Bearer " + adminKey'));
          assert.ok(!retry.includes('Access-Control-Allow-Origin'));
          assert.ok(!preflight.includes('Access-Control-Allow-Origin'));
          assert.ok(!readback.includes('Access-Control-Allow-Origin'));
          assert.ok(retry.includes('.limit(limit)'));
          assert.ok(retry.includes('deliverToGhl'));
          assert.ok(browser.includes('AGM-FULL-SPECTRUM-BUDGET-2026-11-08-V1'));
          assert.ok(privacy.includes('GoHighLevel') && privacy.includes('not automatically deleted'));
          assert.ok(creator.includes('GoHighLevel CRM') && advertiser.includes('GoHighLevel CRM'));
          assert.ok(api.includes('supportedNotices') && api.includes('deliverToGhl'));
          for(const token of ['ALPHA_GHL_PRIVATE_INTEGRATION_TOKEN','ALPHA_GHL_LOCATION_ID','ALPHA_GHL_SYNC_ENABLED','services.leadconnectorhq.com']){
            assert.ok(!browser.includes(token),'Never expose '+token+' on public frontend');
          }
          console.log('CRM consent version, operator-only endpoints, no-secret frontend: PASS');
          NODE

  hosted-intake-synthetic:
    if: github.head_ref == 'feat/agm-ghl-contact-sync-outbox'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/agm-ghl-hosted-smoke.mjs
