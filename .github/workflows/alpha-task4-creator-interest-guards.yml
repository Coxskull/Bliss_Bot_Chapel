name: ALPHA Task4 creator interest boundary and acceptance guards

on:
  pull_request:
    paths:
      - 'frontend/public/join-creator.html'
      - 'frontend/public/creator-account.html'
      - 'frontend/public/creator-registration.html'
      - 'frontend/public/creator-registration.js'
      - 'frontend/public/creator-dashboard.html'
      - 'frontend/public/creator-dashboard.js'
      - 'frontend/public/creator-dashboard.css'
      - 'frontend/public/alpha-intake.js'
      - 'frontend/public/alpha-privacy.html'
      - 'supabase/functions/alpha-public-intake/**'
      - 'scripts/task4-creator-interest-guards.mjs'
      - 'scripts/build-vercel-portal.mjs'
      - 'scripts/com261004-public-forms-smoke.mjs'
      - 'Bliss.Api/Controllers/CreatorRegistrationController.cs'
      - 'Bliss.Api/Controllers/CreatorsController.cs'
      - 'Bliss.Api/Security/CreatorRegistrationBoundary.cs'
      - 'Bliss.Api/Security/BlissAuthenticationOptions.cs'
      - 'Bliss.Api/Security/BlissAuthorization.cs'
      - 'Bliss.Api/Security/SupabaseOidc.cs'
      - 'Bliss.Api/Program.cs'
      - 'Bliss.Domain/Entities/CreatorAccountMembership.cs'
      - 'Bliss.Domain/Entities/CreatorRegistrationReceipt.cs'
      - 'Bliss.Infrastructure/Configurations/CreatorAccountMembershipConfiguration.cs'
      - 'Bliss.Infrastructure/Configurations/CreatorRegistrationReceiptConfiguration.cs'
      - 'Bliss.Infrastructure/Migrations/20261107100000_SecureCreatorRegistration.cs'
      - 'Bliss.Tests/Api/CreatorRegistrationSecurityTests.cs'
      - 'Bliss.Tests/Api/CreatorSelfServiceScopeTests.cs'
      - 'scripts/task4-creator-dashboard-unit.mjs'
      - 'docs/alpha-task4-creator-enrollment-acceptance-20261106.md'
      - 'docs/alpha-task4-creator-registration-20261107.md'
      - '.github/workflows/alpha-task4-creator-interest-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-consent-receipt-crm-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify creator-only interest boundary (no provider calls)
        run: node scripts/task4-creator-interest-guards.mjs
      - name: Verify creator dashboard state, session and role denial (synthetic)
        run: node scripts/task4-creator-dashboard-unit.mjs
