name: ALPHA Privacy Rights Repeated Requests
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261105_alpha_privacy_repeat_requests.sql'
      - 'scripts/agm-privacy-repeat-hosted.mjs'
      - 'scripts/agm-privacy-repeat-safety.test.mjs'
      - 'docs/privacy/**'
      - '.github/workflows/agm-privacy-repeat-rights.yml'
permissions:
  contents: read
jobs:
  offline-privacy-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert privacy-only partial identity index is explicitly scoped
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const sql=fs.readFileSync('supabase/migrations/20261105_alpha_privacy_repeat_requests.sql','utf8');
          assert.match(sql,/WHERE kind IN \('creator', 'advertiser'\)/);
          assert.ok(!sql.includes('DELETE FROM public.alpha_public_intake_requests'));
          console.log('Privacy index preserves creator/advertiser uniqueness: PASS');
          NODE
      - name: Prove no production or non-isolated hosted POST is possible
        run: node --test scripts/agm-privacy-repeat-safety.test.mjs
