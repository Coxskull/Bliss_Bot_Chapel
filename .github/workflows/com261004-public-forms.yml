name: COM-261-004 public creator and advertiser forms

on:
  pull_request:
    paths:
      - 'frontend/public/join-creator.html'
      - 'frontend/public/join-advertiser.html'
      - 'frontend/public/privacy-request.html'
      - 'frontend/public/alpha-*.html'
      - 'frontend/public/alpha-intake.*'
      - 'frontend/public/global-media.html'
      - 'scripts/build-vercel-portal.mjs'
      - 'scripts/com261004-public-*.mjs'
      - 'scripts/alpha-intake-inflight-regression.mjs'
      - '.github/workflows/com261004-public-forms.yml'

permissions:
  contents: read

jobs:
  publish-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public portal with reviewed Railway origin
        env:
          BLISS_APPLICATION_ORIGIN: https://bliss-bot-production-5eb8.up.railway.app
        run: node scripts/build-vercel-portal.mjs
      - name: Verify public forms, notice and private-file exclusion
        run: node scripts/com261004-public-forms-smoke.mjs
      - name: Verify in-flight public inquiry retry safety with fictional data
        run: node scripts/alpha-intake-inflight-regression.mjs
      - name: Package exact public-only build for offline owner QA
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel-portal/index.html
          test -f .vercel-portal/global-media.css
          test -f .vercel-portal/join-advertiser.html
          test -f .vercel-portal/join-creator.html
          test ! -e .vercel-portal/.env
          test ! -e .vercel-portal/creator-dashboard.html
          test ! -e .vercel-portal/advertiser-dashboard.html
          tar -czf "$RUNNER_TEMP/alpha-task19-public-portal.tgz" -C .vercel-portal .
          sha256sum "$RUNNER_TEMP/alpha-task19-public-portal.tgz" | tee "$RUNNER_TEMP/alpha-task19-public-portal.sha256"
          test -s "$RUNNER_TEMP/alpha-task19-public-portal.tgz"
      - name: Retain public-only Task19 review bundle (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: alpha-task19-public-portal-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/alpha-task19-public-portal.tgz
            ${{ runner.temp }}/alpha-task19-public-portal.sha256
          if-no-files-found: error
          retention-days: 3

  hosted-edge-synthetic:
    # One exact authorized integration branch only; not a standing external
    # provider test on future pull requests or forks. Real data is forbidden.
    if: github.head_ref == 'feat/com261-004-public-creator-advertiser-intake'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synthetic-only public Edge receipt and denial contracts
        run: node scripts/com261004-public-http-smoke.mjs
