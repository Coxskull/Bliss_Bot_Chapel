name: Task20 public AI disclosure and owner authorization source check
on:
  pull_request:
    paths:
      - 'frontend/public/alpha-privacy.html'
      - 'frontend/public/global-media.html'
      - 'scripts/task20-public-disclosure-source.test.mjs'
      - '.github/workflows/task20-public-disclosure-source.yml'
permissions:
  contents: read
jobs:
  task20-public-disclosure-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check approved notice and separate opt-in
        run: node scripts/task20-public-disclosure-source.test.mjs
