name: ALPHA-357 existing composer geometry and quality regression
on:
  pull_request:
    paths:
      - 'Bliss.Domain/AdvertisingRealEstate/PodcastAdvertisingGeometry.cs'
      - 'Bliss.Tests/AdvertisingRealEstate/PodcastAdvertisingGeometryTests.cs'
      - 'assets/alpha-prototypes/advertising-real-estate/ALPHA-Composer-Quality-357-Offline.html'
      - 'scripts/alpha357-composer-geometry.test.mjs'
      - '.github/workflows/alpha357-geometry-quality.yml'
permissions:
  contents: read
jobs:
  offline-composer-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact pixel partition, alignment, no gaps or overlaps, no creator intrusion
        run: node --test scripts/alpha357-composer-geometry.test.mjs
