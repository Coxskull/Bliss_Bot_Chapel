name: ALPHA Fictional Public Ad Trial Browser QA
on:
  push:
    branches:
      - feature/alpha-public-fictional-ad-trial-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-offline-creative:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BLISS_APPLICATION_ORIGIN: https://bliss-bot-production-5eb8.up.railway.app/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build public portal with existing safety checks
        run: node scripts/build-vercel-portal.mjs
      - name: Use preinstalled Chrome and isolated Playwright client
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Chrome not installed" >&2
            exit 1
          fi
          npm install --prefix "$RUNNER_TEMP/alpha-public-playwright" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/alpha-public-playwright/node_modules" >> "$GITHUB_ENV"
      - name: Exercise original 2/4/6 browser PNG and WebM outputs locally
        run: node scripts/alpha-public-demo-browser.test.cjs
      - name: Save synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-fictional-public-ad-proof
          path: BrowserEvidence/
          if-no-files-found: warn
          retention-days: 7
