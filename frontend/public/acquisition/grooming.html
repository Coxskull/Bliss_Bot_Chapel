<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grooming report</title>
  <link rel="stylesheet" href="/demonstrations/alpha-demo.css">
  <style>
    #research-form { display: grid; gap: 10px; max-width: 760px; margin: 16px 0; }
    #notice, #friction, #cost, #experiments, #next, #reading, #unchanged { font-size: 16px; line-height: 1.45; max-width: 820px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/acquisition/index.html"><span class="mark">A</span><span><strong>ALPHA</strong><small>GROOMING</small></span></a>
    <a href="/acquisition/index.html">Phase tracker</a>
  </header>
  <main class="wrap">
    <section class="hero">
      <div>
        <p class="status">GROOMING</p>
        <h1>Production events before an external reading</h1>
      </div>
    </section>
    <p id="notice">Reading the stored production events.</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Production event</th><th>Count</th></tr>
        </thead>
        <tbody id="counts"></tbody>
      </table>
    </div>
    <p id="friction"></p>
    <p id="cost"></p>
    <p id="experiments"></p>
    <p id="next"></p>
    <form id="research-form">
      <label>Untrusted excerpt
        <textarea name="excerpt" maxlength="500" required placeholder="Paste an external page. It cannot change production."></textarea>
      </label>
      <button type="submit">Stage the untrusted excerpt</button>
    </form>
    <p id="reading"></p>
    <p id="unchanged"></p>
  </main>
  <script src="/acquisition/grooming.js?v=grooming-1" defer></script>
</body>
</html>
