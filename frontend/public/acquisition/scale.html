<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scale proof</title>
  <link rel="stylesheet" href="/demonstrations/alpha-demo.css">
  <style>
    .hero h1 { font-size: 32px; }
    #notice, #cost, #factory, #unchanged { font-size: 16px; line-height: 1.45; max-width: 860px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/acquisition/index.html"><span class="mark">A</span><span><strong>ALPHA</strong><small>SCALE</small></span></a>
    <a href="/acquisition/index.html">Phase tracker</a>
  </header>
  <main class="wrap">
    <section class="hero">
      <div>
        <p class="status">SCALE PROOF</p>
        <h1>Measure the ladder. Do not claim it.</h1>
      </div>
    </section>
    <p id="notice">Measuring the repeated checks.</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Rung</th><th>Measured</th><th>Checks</th><th>Claim</th><th>Check milliseconds</th></tr>
        </thead>
        <tbody id="rungs"></tbody>
      </table>
    </div>
    <p id="cost"></p>
    <p id="factory"></p>
    <p id="unchanged"></p>
  </main>
  <script src="/acquisition/scale.js?v=scale-1" defer></script>

</html>
