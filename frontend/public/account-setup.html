<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>Set your password | ALPHA GLOBAL MEDIA</title><link rel="stylesheet" href="/oauth-consent.css"></head>
<body><main><p class="brand">ALPHA GLOBAL MEDIA™</p><span class="badge">YOUR WORKSPACE ACCOUNT</span>
<h1>Set your password.</h1><p class="intro">Finish setting up your invited ALPHA account.</p>
<p id="status" role="status" aria-live="polite">Checking your invitation…</p>
<form id="password-setup" hidden><label for="password">New password</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
<label for="confirmation">Confirm password</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" required>
<button type="submit">Save password</button></form>
<a id="continue" href="/login.html" hidden>Continue to sign in</a>
<p class="foot">Your assigned application role controls workspace access. Keep your password private.</p>
</main><script src="/account-setup.bundle.js" defer></script></body></html>
